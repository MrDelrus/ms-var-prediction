[tool.poetry]
name = "markov-switching-model"
version = "0.1.0"
description = ""
authors = ["Nikita Zolin <mrdelrus@yandex.ru>"]
readme = "README.md"
packages = [
    { include = "ms_var_prediction", from = "src" }
]

[tool.poetry.scripts]
backtester = "ms_var_prediction.cli:main"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.3.5"
pandas = "^2.3.3"
scikit-learn = "^1.7.2"
tqdm = "^4.67.1"
matplotlib = "^3.10.7"
scipy = "^1.16.3"
black = "^25.9.0"
ruff = "^0.14.3"
mypy = "^1.18.2"
yfinance = "^0.2.66"
numba = "^0.62.1"
ipykernel = "^7.1.0"
pydantic-settings = "^2.12.0"
wandb = "^0.26.0"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"
pytest = "^9.0.3"

[tool.mypy]
python_version = 3.12
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
