# One block = one experiment.  All experiments in this file are grouped into
# a single W&B run when executed via scripts/run_suite.py.

[suite]
name = "baseline"

[experiments.msm_2state]
name       = "msm_2state"
model_type = "msm"

[experiments.msm_2state.hyperparams]
n_states         = 2
optimizer_method = "powell"
epsilon          = 1e-4

[experiments.msm_2state.experiment_params]
start_date   = "2010-01-01"
end_date     = "2026-01-01"
alpha        = 0.05
window_shape = 250

[experiments.msm_2state.logging]
log_window_csv = true
log_model_csv  = true
log_summary    = true

# ---------------------------------------------------------------------------

[experiments.gmm_2comp]
name       = "gmm_2comp"
model_type = "gmm"

[experiments.gmm_2comp.hyperparams]
n_components    = 2
covariance_type = "full"
tol             = 1e-4
max_iter        = 100

[experiments.gmm_2comp.experiment_params]
start_date   = "2010-01-01"
end_date     = "2026-01-01"
alpha        = 0.05
window_shape = 250

[experiments.gmm_2comp.logging]
log_window_csv = true
log_model_csv  = true
log_summary    = true
